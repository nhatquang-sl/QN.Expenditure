name: Build

on:
  workflow_call:
    inputs:
      changed:
        required: true
        type: boolean
      repo_name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
    outputs:
      image_tag:
        description: "Docker image tag used (newly built or last known)"
        value: ${{ jobs.build.outputs.image_tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.repo_name }}
      - name: Resolve image tag
        id: resolve-tag
        run: |
          if ${{ inputs.changed }}; then
            echo "tag=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TOKEN=$(curl -s -X POST \
              -H "Content-Type: application/json" \
              -d '{"username":"${{ secrets.DOCKERHUB_USERNAME }}","password":"${{ secrets.DOCKERHUB_TOKEN }}"}' \
              https://hub.docker.com/v2/users/login | jq -r .token)
            LATEST=$(curl -s -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.repo_name }}/tags?ordering=last_updated&page_size=2" \
              | jq -r '[.results[] | select(.name != "latest")] | .[0].name')
            echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          fi
      - name: Set VERSION build arg
        id: build-args
        if: inputs.changed
        run: echo "value=VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}" >> "$GITHUB_OUTPUT"
      - name: ⚙️Set up Docker Buildx
        if: inputs.changed
        uses: docker/setup-buildx-action@v4
      - name: 🔑Login to Docker Hub
        if: inputs.changed
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🙏Build and push Docker image
        if: inputs.changed
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          file: ${{ inputs.dockerfile }}
          provenance: false
          build-args: ${{ steps.build-args.outputs.value }}
