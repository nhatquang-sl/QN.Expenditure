name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches:
      - main
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go-auth-bot: ${{ steps.filter.outputs.go-auth-bot }}
      go-email-consumer: ${{ steps.filter.outputs.go-email-consumer }}
      go-email-worker: ${{ steps.filter.outputs.go-email-worker }}
      go-auth-api: ${{ steps.filter.outputs.go-auth-api }}
      ui: ${{ steps.filter.outputs.ui }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find previous tag
        id: prev-tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.prev-tag.outputs.tag }}
          filters: |
            go-auth-bot:
              - 'golang/auth_bot/**'
              - 'golang/shared/**'
            go-email-consumer:
              - 'golang/email_consumer/**'
              - 'golang/shared/**'
              - 'golang/emaildb/**'
            go-email-worker:
              - 'golang/email_worker/**'
              - 'golang/shared/**'
              - 'golang/emaildb/**'
            go-auth-api:
              - 'golang/auth/**'
              - 'golang/shared/**'
            ui:
              - 'src/WebUI.React/**'
            api:
              - 'src/WebAPI/**'

  go-auth-bot:
    needs: detect-changes
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_build-go-auth-bot.yml
    with:
      changed: ${{ github.ref_type == 'tag' && needs.detect-changes.outputs.go-auth-bot == 'true' }}
    secrets: inherit

  api:
    needs: detect-changes
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_build-api.yml
    with:
      changed: ${{ github.ref_type == 'tag' && needs.detect-changes.outputs.api == 'true' }}
    secrets: inherit

  ui:
    needs: detect-changes
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_build-ui.yml
    with:
      changed: ${{ github.ref_type == 'tag' && needs.detect-changes.outputs.ui == 'true' }}
    secrets: inherit

  go-auth-api:
    needs: detect-changes
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_build-go-auth-api.yml
    with:
      changed: ${{ github.ref_type == 'tag' && needs.detect-changes.outputs.go-auth-api == 'true' }}
    secrets: inherit

  go-email-worker:
    needs: detect-changes
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_build-go-email-worker.yml
    with:
      changed: ${{ github.ref_type == 'tag' && needs.detect-changes.outputs.go-email-worker == 'true' }}
    secrets: inherit

  go-email-consumer:
    needs: detect-changes
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_build-go-email-consumer.yml
    with:
      changed: ${{ github.ref_type == 'tag' && needs.detect-changes.outputs.go-email-consumer == 'true' }}
    secrets: inherit

  deploy-docker-to-vps:
    runs-on: ubuntu-latest
    needs: [detect-changes, go-auth-bot, api, ui, go-auth-api, go-email-worker, go-email-consumer]
    # Run deploy when all build jobs completed successfully or were skipped (no changes detected)
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    steps:
      - name: Resolve image tags
        run: |
          echo "API_TAG=${{ needs.api.outputs.image_tag }}" >> "$GITHUB_ENV"
          echo "UI_TAG=${{ needs.ui.outputs.image_tag }}" >> "$GITHUB_ENV"
          echo "GO_AUTH_BOT_TAG=${{ needs.go-auth-bot.outputs.image_tag }}" >> "$GITHUB_ENV"
          echo "GO_AUTH_API_TAG=${{ needs.go-auth-api.outputs.image_tag }}" >> "$GITHUB_ENV"
          echo "GO_EMAIL_WORKER_TAG=${{ needs.go-email-worker.outputs.image_tag }}" >> "$GITHUB_ENV"
          echo "GO_EMAIL_CONSUMER_TAG=${{ needs.go-email-consumer.outputs.image_tag }}" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.SUB_CREDENTIALS }}
          submodules: true
      - name: 🚀Deploy Docker to VPS
        run: |
          mkdir -p $HOME/.ssh
          echo "${{ secrets.VPS_IDENTITY }}" > $HOME/.ssh/ssh.key
          chmod 600 $HOME/.ssh/ssh.key
          SOURCE_DIR="credentials/qex"
          TARGET_DIR="workspace/qex"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "Source directory not found: $SOURCE_DIR"
            exit 1
          fi

          ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p $TARGET_DIR/credentials"
          rsync -az --exclude='docker-compose.local.yml' \
            -e "ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }}" \
            "$SOURCE_DIR"/ ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:$TARGET_DIR/
          rsync -az \
            -e "ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }}" \
            credentials/appsettings.json ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:$TARGET_DIR/credentials/appsettings.json
          ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
            'which pulumi || (curl -fsSL https://get.pulumi.com | sh)'

          ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} 'bash -s' <<'ENDSSH'
            set -euo pipefail

            TARGET_DIR="workspace/qex"
            export PATH=$PATH:$HOME/.pulumi/bin
            export PULUMI_ACCESS_TOKEN="${{ secrets.PULUMI_ACCESS_TOKEN }}"

            cd "$TARGET_DIR"
            ls -la
            echo "WEBAPI_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:${{ env.API_TAG }}" >> .env
            echo "UI_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_UI }}:${{ env.UI_TAG }}" >> .env
            echo "GO_AUTH_API_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_AUTH_API }}:${{ env.GO_AUTH_API_TAG }}" >> .env
            echo "GO_EMAIL_WORKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_EMAIL_WORKER }}:${{ env.GO_EMAIL_WORKER_TAG }}" >> .env
            echo "GO_EMAIL_CONSUMER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_EMAIL_CONSUMER }}:${{ env.GO_EMAIL_CONSUMER_TAG }}" >> .env
            echo "GO_AUTH_BOT_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_AUTH_BOT }}:${{ env.GO_AUTH_BOT_TAG }}" >> .env
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            pulumi env open ${{ secrets.PULUMI_ORG }}/qn-expenditure/prod --format dotenv > .env.pulumi
            chmod 600 .env.pulumi
            docker compose -f docker-compose.yml up -d --wait qex.postgres
            docker run --rm --network=qex --entrypoint migrate \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_AUTH_API }}:${{ env.GO_AUTH_API_TAG }} \
              -path /app/migrations \
              -database "postgres://${{ secrets.DB_USERNAME }}:${{ secrets.DB_PASSWORD }}@qex.postgres/auth?sslmode=disable" \
              up
            docker exec qex-qex.postgres-1 psql -U ${{ secrets.DB_USERNAME }} -d postgres \
              -c "CREATE DATABASE email" || true
            docker run --rm --network=qex --entrypoint migrate \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_EMAIL_WORKER }}:${{ env.GO_EMAIL_WORKER_TAG }} \
              -path /app/migrations \
              -database "postgres://${{ secrets.DB_USERNAME }}:${{ secrets.DB_PASSWORD }}@qex.postgres/email?sslmode=disable" \
              up
            docker compose -f docker-compose.yml up -d --remove-orphans
            docker image prune -a -f
            docker compose ps
          ENDSSH
