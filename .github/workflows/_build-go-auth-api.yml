name: Build go-auth-api

on:
  workflow_call:
    inputs:
      changed:
        required: true
        type: boolean
    outputs:
      image_tag:
        description: "Docker image tag used (newly built or last known)"
        value: ${{ jobs.build-go-auth-api.outputs.image_tag }}

jobs:
  build-go-auth-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_AUTH_API }}
      - name: Resolve image tag
        id: resolve-tag
        run: |
          if ${{ inputs.changed }}; then
            echo "tag=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            commit=$(git log --format="%H" -- golang/auth golang/shared | head -1)
            echo "tag=$(git describe --tags --abbrev=0 "$commit" 2>/dev/null)" >> "$GITHUB_OUTPUT"
          fi
      - name: ⚙️Set up Docker Buildx
        if: inputs.changed
        uses: docker/setup-buildx-action@v4
      - name: 🔑Login to Docker Hub
        if: inputs.changed
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🙏[go-auth-api]Build and push Docker image
        if: inputs.changed
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          file: 'golang/auth/Dockerfile'
          provenance: false
          build-args: |
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
