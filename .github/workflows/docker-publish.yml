name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    # branches: [ "main" ]
    tags:
      - '*'

jobs:
  build-api:
    if: ${{ !contains(github.ref_name, 'deploy') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.SUB_CREDENTIALS }}
          submodules: true
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}
      - name: ⚙️Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🔑Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🙏[api]Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          file: 'src/WebAPI/Dockerfile'
          provenance: false
          build-args: |
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}

  build-ui:
    if: ${{ !contains(github.ref_name, 'deploy') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.SUB_CREDENTIALS }}
          submodules: true
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_UI }}
      - name: ⚙️Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🔑Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🙏[ui]Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          file: 'src/WebUI.React/Dockerfile'
          provenance: false

  build-go-auth-api:
    if: ${{ !contains(github.ref_name, 'deploy') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.SUB_CREDENTIALS }}
          submodules: true
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_AUTH_API }}
      - name: ⚙️Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🔑Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🙏[go-auth-api]Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          file: 'golang/auth/Dockerfile'
          provenance: false
          build-args: |
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}

  setup-postgres:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p $HOME/.ssh
          echo "${{ secrets.VPS_IDENTITY }}" > $HOME/.ssh/ssh.key
          chmod 600 $HOME/.ssh/ssh.key
      - name: Verify and install PostgreSQL on VPS
        run: |
          ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} 'bash -s' <<'ENDSSH'
            set -euo pipefail
            if command -v psql &>/dev/null; then
              echo "PostgreSQL is already installed: $(psql --version)"
              exit 0
            fi
            echo "PostgreSQL not found. Installing..."
            sudo apt-get update -y
            sudo apt-get install -y postgresql
            sudo systemctl enable postgresql
            sudo systemctl start postgresql
            echo "PostgreSQL installed successfully: $(psql --version)"
            sudo -u postgres psql -c "CREATE USER ${{ secrets.DB_USERNAME }} WITH LOGIN PASSWORD '${{ secrets.DB_PASSWORD }}';"
            echo "User '${{ secrets.DB_USERNAME }}' created."
            sudo -u postgres psql -c "CREATE DATABASE auth OWNER ${{ secrets.DB_USERNAME }};"
            echo "Database 'auth' created."
            sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD '${{ secrets.DB_PASSWORD }}';"
            echo "Default 'postgres' superuser password set."
          ENDSSH

  deploy-docker-to-vps:
    runs-on: ubuntu-latest
    needs: [build-api, build-ui, build-go-auth-api]
    # Run deploy in two cases:
    # 1) Tag contains 'deploy' (deploy-only tag; build job can be skipped)
    # 2) Non-deploy tag where all build jobs completed successfully
    if: ${{ always() && (contains(github.ref_name, 'deploy') || (needs.build-api.result == 'success' && needs.build-ui.result == 'success' && needs.build-go-auth-api.result == 'success')) }}
    steps:
      # Derive IMAGE_TAGS from pushed tag by removing 'deploy' marker.
      # Examples:
      # - deploy-1.33 -> 1.33
      # - v1.33 -> v1.33
      - name: Derive IMAGE_TAGS from tag
        run: |
          IMAGE_TAGS="${GITHUB_REF_NAME//deploy/}"
          IMAGE_TAGS="${IMAGE_TAGS#-}"
          IMAGE_TAGS="${IMAGE_TAGS#_}"
          echo "IMAGE_TAGS=$IMAGE_TAGS" >> "$GITHUB_ENV"
      - run: echo "$IMAGE_TAGS"
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.SUB_CREDENTIALS }}
          submodules: true
      - name: 🚀Deploy Docker to VPS
        run: |
          echo "$IMAGE_TAGS"
          mkdir -p $HOME/.ssh
          echo "${{ secrets.VPS_IDENTITY }}" > $HOME/.ssh/ssh.key
          chmod 600 $HOME/.ssh/ssh.key
          SOURCE_DIR="credentials/qex"
          TARGET_DIR="workspace/qex"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "Source directory not found: $SOURCE_DIR"
            exit 1
          fi

          ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p $TARGET_DIR/credentials"
          rsync -az --exclude='docker-compose.local.yml' \
            -e "ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }}" \
            "$SOURCE_DIR"/ ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:$TARGET_DIR/
          rsync -az \
            -e "ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }}" \
            credentials/appsettings.json ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:$TARGET_DIR/credentials/appsettings.json
          ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
            'which pulumi || (curl -fsSL https://get.pulumi.com | sh)'

          ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} 'bash -s' <<'ENDSSH'
            set -euo pipefail

            TARGET_DIR="workspace/qex"
            IMAGE_TAGS="${{ env.IMAGE_TAGS }}"
            export PATH=$PATH:$HOME/.pulumi/bin
            export PULUMI_ACCESS_TOKEN="${{ secrets.PULUMI_ACCESS_TOKEN }}"

            cd "$TARGET_DIR"
            ls -la
            echo "WEBAPI_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:${IMAGE_TAGS}" >> .env
            echo "UI_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_UI }}:${IMAGE_TAGS}" >> .env
            echo "GO_AUTH_API_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_AUTH_API }}:${IMAGE_TAGS}" >> .env
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            pulumi env open ${{ secrets.PULUMI_ORG }}/qn-expenditure/prod --format dotenv > .env.pulumi
            chmod 600 .env.pulumi
            docker run --rm --network=host --entrypoint migrate \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_AUTH_API }}:${IMAGE_TAGS} \
              -path /app/migrations \
              -database "postgres://${{ secrets.DB_USERNAME }}:${{ secrets.DB_PASSWORD }}@localhost/auth?sslmode=disable" \
              up
            docker compose -f docker-compose.yml up -d --remove-orphans
            docker image prune -a -f
            docker compose ps
          ENDSSH
