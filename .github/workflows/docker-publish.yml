name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    # branches: [ "main" ]
    tags:
      - '*'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go-auth-bot: ${{ steps.filter.outputs.go-auth-bot }}
      go-email-consumer: ${{ steps.filter.outputs.go-email-consumer }}
      go-email-worker: ${{ steps.filter.outputs.go-email-worker }}
      go-auth-api: ${{ steps.filter.outputs.go-auth-api }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find previous tag
        id: prev-tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.prev-tag.outputs.tag }}
          filters: |
            go-auth-bot:
              - 'golang/auth_bot/**'
              - 'golang/shared/**'
            go-email-consumer:
              - 'golang/email_consumer/**'
              - 'golang/shared/**'
              - 'golang/emaildb/**'
            go-email-worker:
              - 'golang/email_worker/**'
              - 'golang/shared/**'
              - 'golang/emaildb/**'
            go-auth-api:
              - 'golang/auth/**'
              - 'golang/shared/**'

  build-go-auth-bot:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.go-auth-bot == 'true' && !contains(github.ref_name, 'deploy') }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_build-go-auth-bot.yml
    secrets: inherit

  build-api:
    if: ${{ !contains(github.ref_name, 'deploy') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.SUB_CREDENTIALS }}
          submodules: true
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}
      - name: ⚙️Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🔑Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🙏[api]Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          file: 'src/WebAPI/Dockerfile'
          provenance: false
          build-args: |
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}

  build-ui:
    if: ${{ !contains(github.ref_name, 'deploy') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.SUB_CREDENTIALS }}
          submodules: true
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_UI }}
      - name: ⚙️Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🔑Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🙏[ui]Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          file: 'src/WebUI.React/Dockerfile'
          provenance: false

  build-go-auth-api:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.go-auth-api == 'true' && !contains(github.ref_name, 'deploy') }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_build-go-auth-api.yml
    secrets: inherit

  build-go-email-worker:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.go-email-worker == 'true' && !contains(github.ref_name, 'deploy') }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_build-go-email-worker.yml
    secrets: inherit

  build-go-email-consumer:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.go-email-consumer == 'true' && !contains(github.ref_name, 'deploy') }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_build-go-email-consumer.yml
    secrets: inherit

  deploy-docker-to-vps:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-go-auth-bot, build-api, build-ui, build-go-auth-api, build-go-email-worker, build-go-email-consumer]
    # Run deploy in two cases:
    # 1) Tag contains 'deploy' (deploy-only tag; build jobs are skipped)
    # 2) Non-deploy tag where all build jobs completed successfully or were skipped (no changes detected)
    if: ${{ always() && (contains(github.ref_name, 'deploy') || (needs.build-api.result == 'success' && needs.build-ui.result == 'success' && (needs.build-go-auth-api.result == 'success' || needs.build-go-auth-api.result == 'skipped') && (needs.build-go-email-worker.result == 'success' || needs.build-go-email-worker.result == 'skipped') && (needs.build-go-email-consumer.result == 'success' || needs.build-go-email-consumer.result == 'skipped') && (needs.build-go-auth-bot.result == 'success' || needs.build-go-auth-bot.result == 'skipped'))) }}
    steps:
      # Derive IMAGE_TAGS from pushed tag by removing 'deploy' marker.
      # Examples:
      # - deploy-1.33 -> 1.33
      # - v1.33 -> v1.33
      - name: Derive IMAGE_TAGS from tag
        run: |
          IMAGE_TAGS="${GITHUB_REF_NAME//deploy/}"
          IMAGE_TAGS="${IMAGE_TAGS#-}"
          IMAGE_TAGS="${IMAGE_TAGS#_}"
          echo "IMAGE_TAGS=$IMAGE_TAGS" >> "$GITHUB_ENV"
      - run: echo "$IMAGE_TAGS"
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.SUB_CREDENTIALS }}
          submodules: true
      - name: 🚀Deploy Docker to VPS
        run: |
          echo "$IMAGE_TAGS"
          mkdir -p $HOME/.ssh
          echo "${{ secrets.VPS_IDENTITY }}" > $HOME/.ssh/ssh.key
          chmod 600 $HOME/.ssh/ssh.key
          SOURCE_DIR="credentials/qex"
          TARGET_DIR="workspace/qex"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "Source directory not found: $SOURCE_DIR"
            exit 1
          fi

          ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p $TARGET_DIR/credentials"
          rsync -az --exclude='docker-compose.local.yml' \
            -e "ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }}" \
            "$SOURCE_DIR"/ ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:$TARGET_DIR/
          rsync -az \
            -e "ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }}" \
            credentials/appsettings.json ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:$TARGET_DIR/credentials/appsettings.json
          ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
            'which pulumi || (curl -fsSL https://get.pulumi.com | sh)'

          ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} 'bash -s' <<'ENDSSH'
            set -euo pipefail

            TARGET_DIR="workspace/qex"
            IMAGE_TAGS="${{ env.IMAGE_TAGS }}"
            export PATH=$PATH:$HOME/.pulumi/bin
            export PULUMI_ACCESS_TOKEN="${{ secrets.PULUMI_ACCESS_TOKEN }}"

            cd "$TARGET_DIR"
            ls -la
            echo "WEBAPI_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:${IMAGE_TAGS}" >> .env
            echo "UI_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_UI }}:${IMAGE_TAGS}" >> .env
            echo "GO_AUTH_API_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_AUTH_API }}:${IMAGE_TAGS}" >> .env
            echo "GO_EMAIL_WORKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_EMAIL_WORKER }}:${IMAGE_TAGS}" >> .env
            echo "GO_EMAIL_CONSUMER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_EMAIL_CONSUMER }}:${IMAGE_TAGS}" >> .env
            echo "GO_AUTH_BOT_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_AUTH_BOT }}:${IMAGE_TAGS}" >> .env
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            pulumi env open ${{ secrets.PULUMI_ORG }}/qn-expenditure/prod --format dotenv > .env.pulumi
            chmod 600 .env.pulumi
            docker compose -f docker-compose.yml up -d --wait qex.postgres
            docker run --rm --network=qex --entrypoint migrate \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_AUTH_API }}:${IMAGE_TAGS} \
              -path /app/migrations \
              -database "postgres://${{ secrets.DB_USERNAME }}:${{ secrets.DB_PASSWORD }}@qex.postgres/auth?sslmode=disable" \
              up
            docker exec qex-qex.postgres-1 psql -U ${{ secrets.DB_USERNAME }} -d postgres \
              -c "CREATE DATABASE email" || true
            docker run --rm --network=qex --entrypoint migrate \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_GO_EMAIL_WORKER }}:${IMAGE_TAGS} \
              -path /app/migrations \
              -database "postgres://${{ secrets.DB_USERNAME }}:${{ secrets.DB_PASSWORD }}@qex.postgres/email?sslmode=disable" \
              up
            docker compose -f docker-compose.yml up -d --remove-orphans
            docker image prune -a -f
            docker compose ps
          ENDSSH
