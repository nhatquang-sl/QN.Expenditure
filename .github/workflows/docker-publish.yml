name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    # branches: [ "main" ]
    tags:
      - '*'

jobs:
  build-push-image:
    if: ${{ !contains(github.ref_name, 'deploy') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SUB_CREDENTIALS }}
          submodules: true

      # - name: Run Unit Tests with Coverage
      #   run: |
      #     cd src/Cex
      #     dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage"
      #     reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:TextSummary

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}
      - name: Docker meta
        id: metaUI
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_UI }}

      # Set up BuildKit Docker container builder to be able to build
      - name: ⚙️Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Docker image with Buildx
      - name: 🙏[api]Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          file: 'src/WebAPI/Dockerfile'
          build-args: |
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
      - name: 🙏[ui]Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metaUI.outputs.tags }}
          file: 'src/WebUI.React/Dockerfile'
      - name: 🚀Deploy Docker to VPS
        run: |
          echo "${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}"
    outputs:
      IMAGE_TAGS: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}

  deploy-docker-to-vps:
    runs-on: ubuntu-latest
    needs: [build-push-image]
    # Run deploy in two cases:
    # 1) Tag contains 'deploy' (deploy-only tag; build job can be skipped)
    # 2) Non-deploy tag where build-push-image completed successfully
    if: ${{ always() && (contains(github.ref_name, 'deploy') || needs.build-push-image.result == 'success') }}
    steps:
      # Derive IMAGE_TAGS from pushed tag by removing 'deploy' marker.
      # Examples:
      # - deploy-1.33 -> 1.33
      # - v1.33 -> v1.33
      - name: Derive IMAGE_TAGS from tag
        run: |
          IMAGE_TAGS="${GITHUB_REF_NAME//deploy/}"
          IMAGE_TAGS="${IMAGE_TAGS#-}"
          IMAGE_TAGS="${IMAGE_TAGS#_}"
          echo "IMAGE_TAGS=$IMAGE_TAGS" >> "$GITHUB_ENV"
      - run: echo "$IMAGE_TAGS"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SUB_CREDENTIALS }}
          submodules: true
      - name: 🚀Deploy Docker to VPS
        run: |
          echo "$IMAGE_TAGS" 
          mkdir -p $HOME/.ssh
          echo "${{ secrets.VPS_IDENTITY }}" > $HOME/.ssh/ssh.key
          chmod 600 $HOME/.ssh/ssh.key
          SOURCE_COMPOSE="credentials/qex/docker-compose.yml"
          TARGET_DIR="workspace/qex"

          if [ ! -f "$SOURCE_COMPOSE" ]; then
            echo "Source compose file not found in GitHub runner: $SOURCE_COMPOSE"
            exit 1
          fi

          ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p $TARGET_DIR"
          scp -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -P ${{ secrets.VPS_PORT }} "$SOURCE_COMPOSE" ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:$TARGET_DIR/docker-compose.yml

          ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/ssh.key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} 'bash -s' <<'ENDSSH'
            set -euo pipefail

            TARGET_DIR="workspace/qex"
            IMAGE_TAGS="${{ env.IMAGE_TAGS }}"

            cd "$TARGET_DIR"
            ls -la
            cat > .env <<EOF
          # Container image name for webapi
          WEBAPI_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:${IMAGE_TAGS}

          UI_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY_UI }}:${IMAGE_TAGS}

          # Seq log server
          SEQ_FIRSTRUN_ADMINPASSWORD=${{ secrets.SEQ_ADMIN_PASSWORD }}
          EOF
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker compose -f docker-compose.yml up -d --remove-orphans && docker image prune -a -f && docker compose ps
          ENDSSH
