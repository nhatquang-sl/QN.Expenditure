version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "queries/"
    schema:
      - "schema/"
    gen:
      go:
        package: "generated"
        out: "generated"
        emit_pointers_for_null_types: true
        emit_json_tags: false
        emit_db_tags: false
        rename:
          id: "Id"
          candidate_id: "CandidateId"
          portfolio_snapshot_id: "PortfolioSnapshotId"
          risk_context_id: "RiskContextId"
          risk_decision_id: "RiskDecisionId"
          paper_order_id: "PaperOrderId"
          paper_fill_id: "PaperFillId"
