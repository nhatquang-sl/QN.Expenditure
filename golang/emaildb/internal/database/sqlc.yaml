version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "../application/email_queue/email_queue.sql"
    schema:
      - "schema.sql"
    gen:
      go:
        package: "generated"
        out: "../../generated"
        emit_pointers_for_null_types: true
        emit_json_tags: false
        emit_db_tags: false
